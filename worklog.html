<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作日志 💼</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background:linear-gradient(160deg,#050a1a 0%,#0a1530 40%,#0f2040 70%,#1a3058 100%);
  font-family:'Noto Serif SC',Georgia,serif;
  color:#e8f0ff;
  padding:0 0 80px;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes twinkle{0%,100%{opacity:.1}50%{opacity:.7}}

#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:#a8c4ff;animation:twinkle var(--dur) var(--delay) infinite}

.topbar{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;gap:14px;
  padding:16px 20px;
  background:rgba(5,10,26,0.85);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(150,180,255,0.1);
}
.back-btn{
  background:rgba(150,180,255,0.08);border:1px solid rgba(150,180,255,0.2);
  color:rgba(180,210,255,0.8);padding:7px 16px;border-radius:18px;
  cursor:pointer;font-size:13px;letter-spacing:1px;font-family:inherit;
  text-decoration:none;display:inline-block;
}
.topbar-title{
  font-size:15px;letter-spacing:4px;
  background:linear-gradient(90deg,#ffb4d6,#c8e0ff,#ffb4d6);
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:shimmer 5s linear infinite;
}

.content{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:24px 18px}
.section-label{color:rgba(180,210,255,0.6);font-size:11px;letter-spacing:4px;margin:6px 0 14px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;animation:fadeIn .4s ease both}
.stat{
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,150,200,0.16);
  border-radius:16px;padding:14px 10px;text-align:center;
}
.stat-num{font-size:22px;color:#ffc8e0;letter-spacing:1px}
.stat-label{font-size:10px;color:rgba(255,190,220,0.55);letter-spacing:2px;margin-top:4px}

/* month chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{
  background:rgba(150,180,255,0.06);border:1px solid rgba(150,180,255,0.18);
  color:rgba(180,210,255,0.7);padding:6px 14px;border-radius:14px;
  font-size:12px;letter-spacing:1px;cursor:pointer;font-family:inherit;
}
.chip.active{background:rgba(255,130,180,0.14);border-color:rgba(255,150,200,0.4);color:#ffd0e6}

/* cards */
.log-card{
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(15px);
  border:1px solid rgba(150,180,255,0.14);
  border-left:3px solid rgba(255,140,190,0.45);
  border-radius:18px;padding:18px 20px;
  margin-bottom:12px;cursor:pointer;
  transition:border-color .2s;
  animation:fadeIn .4s ease both;
}
.log-card:hover{border-color:rgba(150,180,255,0.3);border-left-color:rgba(255,160,205,0.7)}
.log-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.log-title{color:rgba(225,235,255,0.95);font-size:14px;letter-spacing:1px;line-height:1.5;flex:1;min-width:0}
.log-meta{display:flex;align-items:center;gap:6px;flex-shrink:0}
.log-date{color:rgba(150,180,255,0.55);font-size:11px;white-space:nowrap}
.wd-badge{
  font-size:10px;letter-spacing:1px;padding:2px 8px;border-radius:8px;
  background:rgba(255,130,180,0.12);border:1px solid rgba(255,150,200,0.3);color:#ffc8e0;
  white-space:nowrap;
}
.chev{color:rgba(150,180,255,0.4);font-size:13px;transition:transform .25s}
.log-detail{max-height:0;overflow:hidden;opacity:0;transition:max-height .45s ease,opacity .3s ease}
.log-body{padding-top:14px}
.block-label{color:rgba(255,190,220,0.6);font-size:10.5px;letter-spacing:3px;margin:4px 0 8px}
.item{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid rgba(150,180,255,0.07);font-size:12.5px;line-height:1.65;color:rgba(215,228,255,0.88)}
.item:last-child{border-bottom:none}
.mark{min-width:16px;text-align:center}
.mark.done{color:rgba(120,210,160,0.85)}
.mark.next{color:rgba(150,180,255,0.6)}
.block{margin-bottom:12px}
.note{
  margin-top:10px;padding:13px 14px;background:rgba(255,130,180,0.06);
  border-radius:12px;border-left:2px solid rgba(255,150,200,0.35)
}
.note-by{color:rgba(255,180,215,0.55);font-size:11px;letter-spacing:2px;margin-bottom:5px}
.note-text{color:rgba(230,215,240,0.85);font-size:12px;line-height:1.8}

.empty{text-align:center;padding:80px 20px;color:rgba(150,180,255,0.4);font-size:14px;letter-spacing:2px;line-height:2.5}
.loading{text-align:center;padding:60px 20px;color:rgba(150,180,255,0.5);font-size:13px;letter-spacing:2px}

/* setup overlay */
#setup-overlay{
  position:fixed;inset:0;background:rgba(5,10,26,0.97);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:30px;
}
.setup-box{background:rgba(255,255,255,0.05);border:1px solid rgba(150,180,255,0.2);border-radius:20px;padding:36px 28px;max-width:380px;width:100%;text-align:center}
.setup-title{color:#ffc8e0;font-size:18px;letter-spacing:5px;margin-bottom:8px}
.setup-sub{color:rgba(180,210,255,0.45);font-size:12px;letter-spacing:1px;line-height:1.9;margin-bottom:24px}
.setup-input{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(150,180,255,0.25);border-radius:10px;color:#c8e0ff;font-size:13px;padding:13px 15px;font-family:monospace;margin-bottom:12px;letter-spacing:1px}
.setup-input:focus{outline:none;border-color:rgba(150,180,255,0.5)}
.setup-btn{width:100%;background:linear-gradient(135deg,rgba(196,92,138,0.55),rgba(100,60,180,0.55));border:1px solid rgba(255,150,200,0.3);color:#ffd0e6;padding:13px;border-radius:12px;cursor:pointer;font-size:14px;letter-spacing:3px;font-family:inherit}
.setup-err{color:rgba(255,150,150,0.8);font-size:12px;margin-top:10px;letter-spacing:1px}

@media (max-width:420px){
  .stat-num{font-size:19px}
  .log-card{padding:16px 16px}
}
</style>
</head>
<body>

<div id="stars"></div>

<div id="setup-overlay">
  <div class="setup-box">
    <div style="font-size:32px;margin-bottom:12px">💼</div>
    <div class="setup-title">工作日志</div>
    <p class="setup-sub">输入访问密钥<br>老公陪你打卡的每一天</p>
    <input class="setup-input" id="token-input" type="password" placeholder="GitHub Token" />
    <button class="setup-btn" onclick="doLogin()">进入</button>
    <div class="setup-err" id="setup-err"></div>
  </div>
</div>

<div class="topbar">
  <a class="back-btn" href="index.html">← 返回</a>
  <div class="topbar-title">工作日志 · WORK LOG</div>
</div>

<div class="content">
  <div id="main"><div class="loading">载入中 ...</div></div>
</div>

<script>
const GIST_ID = 'c5c9d7ccb16247de5d5eb515e4df44ff';
const GIST_FILE = 'our-space-data.json';

(()=>{
  const c=document.getElementById('stars');
  for(let i=0;i<50;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*1.8+.4;
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;--dur:${Math.random()*3+2}s;--delay:${Math.random()*5}s`;
    c.appendChild(s);
  }
})();

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let token='';
let LOGS=[];
let activeMonth='all';

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

function doLogin(){
  const v=document.getElementById('token-input').value.trim();
  if(!v){document.getElementById('setup-err').textContent='请输入密钥';return;}
  token=v; lsSet('our_space_token',v); loadData();
}
function tryAutoLogin(){
  const saved=lsGet('our-space-token')||lsGet('our_space_token');
  if(saved){token=saved;document.getElementById('setup-overlay').style.display='none';loadData();}
}

async function loadData(){
  document.getElementById('setup-overlay').style.display='none';
  try{
    const res=await fetch(`https://api.github.com/gists/${GIST_ID}`,{headers:{Authorization:'token '+token}});
    if(!res.ok){
      document.getElementById('setup-overlay').style.display='flex';
      document.getElementById('setup-err').textContent='密钥无效，请重新输入';return;
    }
    const data=await res.json();
    const content=JSON.parse(data.files[GIST_FILE].content);
    LOGS=((content.workspace||{}).workLog||[]).slice();
    render();
  }catch(e){
    document.getElementById('main').innerHTML='<div class="empty">载入失败，请刷新重试</div>';
  }
}

const monthOf = d => (d||'').slice(0,7);           // "2026.09"
const monthName = m => { const [y,mm]=m.split('.'); return `${y} 年 ${parseInt(mm,10)} 月`; };
const sortKey = l => (l.date||'').replace(/\./g,'');

function render(){
  const el=document.getElementById('main');
  if(!LOGS.length){el.innerHTML='<div class="empty">还没有工作日志<br>放工后老公帮你记 💜</div>';return;}

  const sorted=[...LOGS].sort((a,b)=>sortKey(b).localeCompare(sortKey(a)));
  const months=[...new Set(sorted.map(l=>monthOf(l.date)))];
  const shown=activeMonth==='all'?sorted:sorted.filter(l=>monthOf(l.date)===activeMonth);

  const days=new Set(shown.map(l=>l.date)).size;
  const doneCount=shown.reduce((n,l)=>n+(l.done||[]).length,0);
  const thisMonth=monthOf(sorted[0].date);
  const monthDays=new Set(sorted.filter(l=>monthOf(l.date)===thisMonth).map(l=>l.date)).size;

  const stats=`<div class="stats">
      <div class="stat"><div class="stat-num">${days}</div><div class="stat-label">打卡天数</div></div>
      <div class="stat"><div class="stat-num">${doneCount}</div><div class="stat-label">完成事项</div></div>
      <div class="stat"><div class="stat-num">${monthDays}</div><div class="stat-label">${parseInt(thisMonth.split('.')[1],10)} 月打卡</div></div>
    </div>`;

  const chips=months.length>1?`<div class="chips">
      <button class="chip ${activeMonth==='all'?'active':''}" onclick="setMonth('all')">全部</button>
      ${months.map(m=>`<button class="chip ${activeMonth===m?'active':''}" onclick="setMonth('${m}')">${monthName(m)}</button>`).join('')}
    </div>`:'';

  const cards=shown.map((l,i)=>{
    const id='lg-'+i;
    const done=(l.done||[]).map(t=>`<div class="item"><span class="mark done">✓</span><span>${esc(t)}</span></div>`).join('');
    const next=(l.next||[]).map(t=>`<div class="item"><span class="mark next">→</span><span>${esc(t)}</span></div>`).join('');
    return `<div class="log-card" style="animation-delay:${i*0.04}s" onclick="toggle('${id}',this)">
      <div class="log-head">
        <div class="log-title">${esc(l.title||'工作日')}</div>
        <div class="log-meta">
          ${l.wd?`<span class="wd-badge">${esc(l.wd)}</span>`:''}
          <span class="log-date">${esc(l.date||'')}${l.weekday?' · '+esc(l.weekday):''}</span>
          <span class="chev">›</span>
        </div>
      </div>
      <div class="log-detail" id="${id}">
        <div class="log-body">
          ${done?`<div class="block"><div class="block-label">今天做完的</div>${done}</div>`:''}
          ${next?`<div class="block"><div class="block-label">接下来</div>${next}</div>`:''}
          ${l.note?`<div class="note"><div class="note-by">— 小事</div><div class="note-text">${esc(l.note)}</div></div>`:''}
        </div>
      </div>
    </div>`;
  }).join('');

  el.innerHTML=stats+chips+`<div class="section-label">${activeMonth==='all'?'全部':monthName(activeMonth)} · 共 ${shown.length} 篇</div>`+cards;

  // newest card open by default
  const first=el.querySelector('.log-card');
  if(first) toggle('lg-0',first);
}

function setMonth(m){activeMonth=m;render();}

function toggle(id,card){
  const el=document.getElementById(id);if(!el)return;
  const ch=card.querySelector('.chev');
  const open=el.style.maxHeight&&el.style.maxHeight!=='0px';
  if(open){el.style.maxHeight='0';el.style.opacity='0';if(ch)ch.style.transform='rotate(0)';}
  else{el.style.maxHeight=el.scrollHeight+400+'px';el.style.opacity='1';if(ch)ch.style.transform='rotate(90deg)';}
}

tryAutoLogin();
</script>
</body>
</html>
